services:
  growth-ai-chat:
    build:
      context: .
    image: growthlabs-ai-chat-fe:local
    container_name: growth-ai-chat
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1770
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 32m
    environment:
      GROWTH_API_UPSTREAM: http://growth-api:8080
      NGINX_ENVSUBST_FILTER: GROWTH_API_UPSTREAM
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O - http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.growth-ai-chat.entrypoints=web"
      - "traefik.http.routers.growth-ai-chat.rule=Host(`g-chat.growthlabs.pt`)"
      - "traefik.http.routers.growth-ai-chat.priority=200"
      - "traefik.http.services.growth-ai-chat.loadbalancer.server.port=8080"
    networks:
      - web

networks:
  web:
    external: true

