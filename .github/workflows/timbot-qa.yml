name: TimBot QA
run-name: TimBot QA ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id: {required: true, type: string}
      head_sha: {required: true, type: string}
      base_sha: {required: true, type: string}
      branch_base_sha: {required: false, type: string, default: ''}
      profile: {required: true, type: string}
permissions: {}
jobs:
  test:
    runs-on: ${{ inputs.profile == 'apple' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: inputs.profile == 'android'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        if: inputs.profile == 'android'
      - name: Prepare Android SDK
        if: inputs.profile == 'android'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Execute TimBot QA
        env:
          QA_RUN: ${{ inputs.run_id }}
          QA_HEAD: ${{ inputs.head_sha }}
          QA_BASE: ${{ inputs.base_sha }}
          QA_BRANCH_BASE: ${{ inputs.branch_base_sha }}
          QA_PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          source = zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(source).hexdigest() == "9c6e0ed8e093a9e8cc39ae94338a64a21fd0dc9cc14b3fa173738c75da38b0f0"
          target = pathlib.Path('/tmp/timbot-qa-runner.py')
          target.write_bytes(source)
          subprocess.run(['python3', str(target), '--run-id', os.environ['QA_RUN'], '--head-sha', os.environ['QA_HEAD'], '--base-sha', os.environ['QA_BASE'], '--branch-base-sha', os.environ['QA_BRANCH_BASE'], '--profile', os.environ['QA_PROFILE'], '--output', '/tmp/timbot-qa-report.json'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timbot-qa-report
          path: |
            /tmp/timbot-qa-report.json
            /tmp/timbot-qa-browser.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: timbot-qa-report
          path: /tmp/qa-artifact
      - name: Send evidence to TimBot
        env:
          QA_RUN: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.parse, urllib.request
          path = pathlib.Path('/tmp/qa-artifact/timbot-qa-report.json')
          assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 8500000
          report = json.loads(path.read_bytes())
          assert report['run_id'] == os.environ['QA_RUN']
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote('timbot-qa:' + os.environ['QA_RUN'])
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req, timeout=30))['value']
          bundle = path.with_name('timbot-qa-browser.zip')
          manifest = report.get('browser_artifact')
          if manifest and bundle.is_file() and not bundle.is_symlink():
              assert bundle.stat().st_size <= 32000000
              raw = bundle.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == manifest['sha256'] and len(raw) == manifest['size']
              upload = urllib.request.Request("https://timbot-api.growthlabs.pt/v1/qa/runs/" + report['run_id'] + '/artifacts', data=raw,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/zip', 'User-Agent': 'TimBot-QA/1.1'})
              try:
                  with urllib.request.urlopen(upload, timeout=90) as response:
                      assert response.status == 202
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  print('::warning::O relatório visual permanece no artefato do GitHub. A evidência canônica será entregue sem descartar os testes.')
          req = urllib.request.Request("https://timbot-api.growthlabs.pt/v1/qa/reports", data=json.dumps(report, ensure_ascii=False).encode(), headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'TimBot-QA/1.1'})
          # Identical run ID and report digest make delivery retries idempotent at the receiver.
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      assert response.status == 202
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in {429, 502, 503, 504} or attempt == 3:
                      raise
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 3:
                      raise
              time.sleep(2 ** attempt)
          PY
